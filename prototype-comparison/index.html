<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172322">
  <title>α生態戦 | UI比較 C1</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/lucide.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">α</span><h1>生態戦<span>UI比較 C1</span></h1></div>
    <nav class="segmented" aria-label="表示比較">
      <button type="button" data-view="visual" aria-pressed="true">B ビジュアル</button>
      <button type="button" data-view="classic" aria-pressed="false">A 旧表示</button>
    </nav>
    <a class="original-link" href="../prototype/index.html" target="_blank" rel="noopener">現行版<i data-lucide="external-link"></i></a>
  </header>
  <main>
    <section class="match-controls" aria-label="対戦編成">
      <label><span class="side-label player">自分</span><select id="playerPreset" aria-label="自分の編成" disabled></select></label>
      <span class="versus">VS</span>
      <label><span class="side-label enemy">相手</span><select id="enemyPreset" aria-label="相手の編成" disabled></select></label>
      <button id="run" type="button" class="primary" disabled><i data-lucide="swords"></i>対戦</button>
      <button id="edit" type="button" class="icon-button" title="編成を編集" aria-label="編成を編集" aria-pressed="false" disabled><i data-lucide="layout-grid"></i></button>
    </section>
    <p id="message" role="status">比較用カードプールを読み込み中…</p>
    <section class="replay-controls" aria-label="リプレイ操作">
      <button id="first" class="icon-button" title="先頭" aria-label="先頭" disabled><i data-lucide="skip-back"></i></button>
      <button id="prev" class="icon-button" title="前の行動" aria-label="前の行動" disabled><i data-lucide="step-back"></i></button>
      <button id="play" class="icon-button play-button" title="再生" aria-label="再生" disabled><i data-lucide="play"></i></button>
      <button id="next" class="icon-button" title="次の行動" aria-label="次の行動" disabled><i data-lucide="step-forward"></i></button>
      <button id="last" class="icon-button" title="最後" aria-label="最後" disabled><i data-lucide="skip-forward"></i></button>
      <select id="turn" aria-label="ターンへ移動" disabled><option>0T</option></select>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="リプレイ位置" disabled>
      <output id="position">0 / 0</output>
      <select id="speed" aria-label="再生速度"><option value="1.6">0.5×</option><option value="1" selected>1×</option><option value="0.5">2×</option></select>
    </section>
    <div id="visualView">
      <section class="queue-band" aria-label="実際の行動順"><span class="queue-caption">行動順</span><div id="queue"></div></section>
      <div class="workspace">
        <section class="arena" aria-label="戦場">
          <div class="army-heading enemy"><strong>相手</strong><span id="enemySummary"></span></div>
          <div id="enemyBoard" class="board enemy-board" aria-label="相手の盤面"></div>
          <div class="event-band">
            <div><span id="turnBadge">0T</span><strong id="eventTitle">編成確認</strong></div>
            <div class="segmented phases" aria-label="行動の表示段階">
              <button data-phase="before" aria-pressed="false">対象</button><button data-phase="after" aria-pressed="true">結果</button>
            </div>
          </div>
          <div id="playerBoard" class="board player-board" aria-label="自分の盤面"></div>
          <div class="army-heading player"><strong>自分</strong><span id="playerSummary"></span></div>
        </section>
        <aside class="inspector" aria-label="選択と行動の詳細">
          <div class="inspector-heading"><h2 id="detailHeading">選択カード</h2><button id="closeDetail" class="icon-button" aria-label="詳細を閉じる" title="詳細を閉じる"><i data-lucide="x"></i></button></div>
          <div id="detail"></div>
          <section class="changes-section"><h2>この行動の変化</h2><div id="changes"></div></section>
          <details id="logDetails"><summary>行動ログ</summary><ol id="eventLog"></ol></details>
          <details class="legend"><summary>アイコン凡例</summary><div id="legend"></div></details>
        </aside>
      </div>
    </div>
    <section id="classicView" hidden aria-label="旧表示との比較">
      <iframe id="engine" title="比較用の旧表示とカード編集" src="./baseline/index.html"></iframe>
    </section>
  </main>
</body>
</html>
