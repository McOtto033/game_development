name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage playable builds
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R prototype/. "$RUNNER_TEMP/pages/"
          cp -R prototype prototype-comparison "$RUNNER_TEMP/pages/"
          touch "$RUNNER_TEMP/pages/.nojekyll"

      - name: Upload playable builds
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
