<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#146c60" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="α生態戦" />
    <meta name="format-detection" content="telephone=no" />
    <title>α生態戦プロトタイプ</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">3x3 auto tactics prototype</p>
          <h1>α生態戦プロトタイプ</h1>
        </div>
        <div class="summary-strip" aria-live="polite">
          <span id="costSummary">Cost -</span>
          <span id="winnerSummary">未実行</span>
        </div>
      </header>

      <section class="control-band" aria-label="編成">
        <label>
          自軍
          <select id="playerPreset"></select>
        </label>
        <label>
          敵軍
          <select id="enemyPreset"></select>
        </label>
        <label>
          地形編集
          <select id="editSide">
            <option value="player">自軍</option>
            <option value="enemy">敵軍</option>
          </select>
        </label>
        <label>
          操作
          <select id="editMode">
            <option value="inspect">カード確認</option>
            <option value="card">カード配置</option>
            <option value="general">α指定</option>
            <option value="terrain">地形変更</option>
          </select>
        </label>
        <label>
          再生速度
          <select id="replaySpeed">
            <option value="1">標準</option>
            <option value="0.5">ゆっくり</option>
          </select>
        </label>
        <div class="button-row">
          <button id="runBattle" type="button">100戦対戦</button>
          <button id="runRoundRobin" type="button" class="secondary">モデル総当たり</button>
          <button id="playReplay" type="button" class="secondary" disabled>リプレイ再生</button>
          <button id="resetBattle" type="button" class="secondary">初期化</button>
        </div>
      </section>

      <section class="workbench-grid" aria-label="編成と検証">
        <aside class="data-panel deck-tool" aria-labelledby="libraryTitle">
          <div class="panel-heading">
            <h2 id="libraryTitle">カードリスト</h2>
            <span id="editorMessage" class="cost-pill">編集なし</span>
          </div>
          <select id="cardPicker" class="visually-hidden" aria-label="選択カード"></select>
          <div id="cardLibrary" class="card-library"></div>
          <div class="terrain-block">
            <div class="panel-heading compact-heading">
              <h2 id="fieldTitle">地形</h2>
              <span id="terrainCost" class="cost-pill">-</span>
            </div>
            <div id="terrainPalette" class="terrain-palette"></div>
          </div>
          <div class="deck-register">
            <label>
              登録名
              <input id="deckName" type="text" maxlength="24" placeholder="森奇襲テスト" />
            </label>
            <div class="button-row">
              <button id="saveDeck" type="button" class="secondary">編成を登録</button>
              <button id="deleteDeck" type="button" class="secondary">登録削除</button>
            </div>
          </div>
        </aside>

        <section class="battle-layout">
          <section class="army-panel enemy-side" aria-labelledby="enemyTitle">
            <div class="panel-heading">
              <h2 id="enemyTitle">敵軍</h2>
              <span id="enemyCost" class="cost-pill">-</span>
            </div>
            <div id="enemyBoard" class="board enemy-board" aria-label="敵軍盤面"></div>
          </section>

          <section class="center-panel" aria-label="戦況">
            <div class="status-box">
              <p class="eyebrow">Victory</p>
              <strong>α撃破</strong>
              <span id="turnCount" class="cost-pill">0T</span>
            </div>
            <div id="phaseSummary" class="phase-summary">編成確認中</div>
          </section>

          <section class="army-panel player-side" aria-labelledby="playerTitle">
            <div class="panel-heading">
              <h2 id="playerTitle">自軍</h2>
              <span id="playerCost" class="cost-pill">-</span>
            </div>
            <div id="playerBoard" class="board player-board" aria-label="自軍盤面"></div>
          </section>
        </section>

        <aside class="side-stack">
          <section class="data-panel card-panel" aria-labelledby="cardTitle">
            <div class="panel-heading">
              <h2 id="cardTitle">カード</h2>
              <span id="selectedCardName" class="cost-pill">選択なし</span>
            </div>
            <div id="cardDetail" class="card-detail"></div>
          </section>

          <section class="data-panel sim-panel" aria-labelledby="simTitle">
            <div class="panel-heading">
              <h2 id="simTitle">検証結果</h2>
              <span id="matchupBadge" class="cost-pill">未実行</span>
            </div>
            <div id="matchupSummary" class="matchup-summary"></div>
            <div id="roundRobinTable" class="round-robin"></div>
          </section>

          <section class="data-panel log-panel" aria-labelledby="logTitle">
            <div class="panel-heading">
              <h2 id="logTitle">戦闘ログ</h2>
            </div>
            <ol id="battleLog" class="battle-log"></ol>
          </section>
        </aside>
      </section>

      <section class="data-panel reference-panel hidden-reference" aria-labelledby="referenceTitle">
        <div class="panel-heading">
          <h2 id="referenceTitle">仕様一覧</h2>
          <span class="cost-pill">現行</span>
        </div>
        <div class="reference-grid">
          <section aria-labelledby="cardReferenceTitle">
            <h3 id="cardReferenceTitle">カード</h3>
            <div id="cardReference" class="reference-list"></div>
          </section>
          <section aria-labelledby="actionReferenceTitle">
            <h3 id="actionReferenceTitle">行動</h3>
            <div id="actionReference" class="reference-list"></div>
          </section>
          <section aria-labelledby="terrainReferenceTitle">
            <h3 id="terrainReferenceTitle">地形</h3>
            <div id="terrainReference" class="reference-list"></div>
          </section>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
